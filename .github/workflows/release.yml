name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Tools
        run: brew install xcodegen
      - name: Fetch idevice
        run: ./scripts/fetch-idevice.sh
      - name: Build unsigned app
        run: |
          xcodegen generate
          xcodebuild -project Elsewhere.xcodeproj -scheme Elsewhere -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Elsewhere.app Payload/
          zip -qry Elsewhere.ipa Payload
          shasum -a 256 Elsewhere.ipa | tee Elsewhere.ipa.sha256
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            Elsewhere.ipa
            Elsewhere.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Elsewhere-ipa
          path: Elsewhere.ipa
